<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8efe4" />
  <title>Tres cartas para vos</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="site-shell">
    <div class="corner-flower corner-flower--top" aria-hidden="true">
      <div class="flower-head"></div>
    </div>
    <div class="corner-flower corner-flower--bottom" aria-hidden="true">
      <div class="flower-head"></div>
    </div>
    <section class="landing-view" id="landingView" aria-labelledby="pageTitle">
      <figure class="photo-collage" aria-label="Recuerdos de bebé">
        <img class="collage-photo collage-photo--featured"
          src="images/Fotos%20Daiara%20Bebe/WhatsApp%20Image%202026-09-22%20at%2011.14.45%20PM.jpeg" alt="" />
        <img class="collage-photo"
          src="images/Fotos%20Daiara%20Bebe/WhatsApp%20Image%202026-09-22%20at%2011.14.45%20PM%20(1).jpeg" alt="" />
        <img class="collage-photo"
          src="images/Fotos%20Daiara%20Bebe/WhatsApp%20Image%202026-09-22%20at%2011.14.45%20PM%20(2).jpeg" alt="" />
        <img class="collage-photo"
          src="images/Fotos%20Daiara%20Bebe/WhatsApp%20Image%202026-09-22%20at%2011.14.45%20PM%20(3).jpeg" alt="" />
        <img class="collage-photo"
          src="images/Fotos%20Daiara%20Bebe/WhatsApp%20Image%202026-09-22%20at%2011.14.45%20PM%20(4).jpeg" alt="" />
        <img class="collage-photo"
          src="images/Fotos%20Daiara%20Bebe/WhatsApp%20Image%202026-09-22%20at%2011.14.45%20PM%20(5).jpeg" alt="" />
      </figure>
      <header class="intro">
        <p class="eyebrow">Una sorpresa para tu cumpleaños</p>
        <h1 id="pageTitle">Tres cartas para vos</h1>
        <p class="intro-copy">Abrí cada sobre cuando quieras. Adentro hay un pedacito de todo lo que siento por vos.</p>
      </header>
      <div class="envelope-grid" aria-label="Cartas disponibles">
        <button class="envelope-card" data-letter="0" type="button" aria-label="Abrir carta: Lo que amo de vos"><span
            class="envelope-art" aria-hidden="true"><span class="envelope-back"></span><span
              class="envelope-flap"></span><span class="envelope-front"></span><span
              class="envelope-seal">✦</span></span><span class="envelope-content"><span class="envelope-number">CARTA
              01</span><span class="envelope-label">Lo que amo de vos</span><span class="envelope-cta">Tocá para abrir
              →</span></span></button>
        <button class="envelope-card" data-letter="1" type="button" aria-label="Abrir carta: Nuestros recuerdos"><span
            class="envelope-art" aria-hidden="true"><span class="envelope-back"></span><span
              class="envelope-flap"></span><span class="envelope-front"></span><span
              class="envelope-seal">✦</span></span><span class="envelope-content"><span class="envelope-number">CARTA
              02</span><span class="envelope-label">Nuestros recuerdos</span><span class="envelope-cta">Tocá para abrir
              →</span></span></button>
        <button class="envelope-card" data-letter="2" type="button"
          aria-label="Abrir carta: Deseos para tu cumpleaños"><span class="envelope-art" aria-hidden="true"><span
              class="envelope-back"></span><span class="envelope-flap"></span><span class="envelope-front"></span><span
              class="envelope-seal">✦</span></span><span class="envelope-content"><span class="envelope-number">CARTA
              03</span><span class="envelope-label">Deseos para tu cumpleaños</span><span class="envelope-cta">Tocá para
              abrir →</span></span></button>
      </div>
      <p class="opening-note">Hecho con flores amarillas, paciencia y mucho amor.</p>
    </section>
    <section class="letter-view" id="letterView" aria-hidden="true" aria-labelledby="letterTitle">
      <button class="back-button" id="backButton" type="button"><span class="back-arrow" aria-hidden="true">←</span>
        Volver a los sobres</button>
      <article class="letter-card">
        <div class="letter-inner">
          <div class="flower letter-flower" aria-hidden="true">
            <div class="flower-head"></div>
          </div>
          <figure class="letter-photo" id="letterPhoto">
            <div class="letter-photo-grid"><img id="letterImageOne" alt="" /><img id="letterImageTwo" alt="" /></div>
            <div class="photo-fallback" id="photoFallback"><span id="fallbackText">Para vos</span></div>
          </figure>
          <p class="letter-kicker" id="letterKicker"></p>
          <h2 class="letter-title" id="letterTitle"></h2>
          <div class="letter-copy" id="letterCopy"></div>
          <p class="signature" id="letterSignature"></p>
        </div>
      </article>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
