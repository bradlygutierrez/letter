<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8efe4" />
  <title>Tres cartas para vos</title>
  <style>
    :root {
      --cream: #f8efe4;
      --paper: #fffaf2;
      --ink: #3f3034;
      --muted: #77666a;
      --wine: #7a3d4f;
      --wine-dark: #4e2535;
      --yellow: #eebc4e;
      --yellow-light: #f8d97b;
      --leaf: #82905c;
      --ease: cubic-bezier(0.22, 0.78, 0.24, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--cream);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: radial-gradient(circle at 8% 8%, rgba(255, 255, 255, .8), transparent 23rem), radial-gradient(circle at 92% 14%, rgba(241, 197, 185, .36), transparent 22rem), var(--cream);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
    }

    .site-shell {
      position: relative;
      width: min(100%, 1180px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 14px 38px;
      isolation: isolate;
    }

    .corner-flower,
    .flower {
      position: absolute;
      pointer-events: none;
      color: var(--yellow);
    }

    .corner-flower {
      z-index: -1;
      opacity: .78;
    }

    .corner-flower--top {
      top: 14px;
      right: -22px;
      transform: rotate(18deg) scale(.72);
    }

    .corner-flower--bottom {
      bottom: 18px;
      left: -28px;
      transform: rotate(-22deg) scale(.7);
    }

    .flower-head {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle, #bd8127 0 13%, transparent 14%), conic-gradient(from 12deg, var(--yellow-light) 0 12%, transparent 12% 25%, var(--yellow-light) 25% 37%, transparent 37% 50%, var(--yellow-light) 50% 62%, transparent 62% 75%, var(--yellow-light) 75% 87%, transparent 87%);
    }

    .flower-head::after,
    .flower-head::before {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: var(--leaf);
    }

    .flower-head::after {
      width: 8px;
      height: 50px;
      top: 30px;
      left: 22px;
      transform: rotate(18deg);
      transform-origin: top;
    }

    .flower-head::before {
      width: 22px;
      height: 10px;
      top: 62px;
      left: 6px;
      transform: rotate(-20deg);
      border-radius: 100% 0 100% 0;
    }

    .landing-view {
      display: grid;
      align-content: start;
      min-height: calc(100vh - 60px);
      transition: opacity 420ms ease, transform 560ms var(--ease), visibility 0s linear 0s;
    }

    .landing-view.is-leaving {
      opacity: 0;
      transform: scale(.96) translateY(12px);
      visibility: hidden;
      transition-delay: 0s, 0s, 420ms;
    }

    .photo-collage {
      position: relative;
      width: min(100%, 510px);
      height: clamp(154px, 43vw, 220px);
      margin: 0 auto 24px;
    }

    .collage-photo {
      position: absolute;
      display: block;
      width: 23%;
      height: 45%;
      padding: 5px;
      border: 1px solid rgba(122, 61, 79, .15);
      border-radius: 15px;
      background: var(--paper);
      box-shadow: 0 12px 22px rgba(93, 49, 47, .14);
      object-fit: cover;
    }

    .collage-photo--featured {
      top: 6%;
      left: 31%;
      z-index: 3;
      width: 38%;
      height: 84%;
      transform: rotate(-2deg);
    }

    .collage-photo:nth-child(2) {
      top: 18%;
      left: 4%;
      transform: rotate(-8deg);
    }

    .collage-photo:nth-child(3) {
      top: 2%;
      left: 9%;
      transform: rotate(5deg);
    }

    .collage-photo:nth-child(4) {
      top: 19%;
      right: 4%;
      transform: rotate(8deg);
    }

    .collage-photo:nth-child(5) {
      top: 3%;
      right: 10%;
      transform: rotate(-5deg);
    }

    .collage-photo:nth-child(6) {
      bottom: 0;
      left: 21%;
      z-index: 4;
      height: 34%;
      transform: rotate(6deg);
    }

    .intro {
      max-width: 720px;
      margin: 0 auto 28px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--wine);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1,
    h2,
    .envelope-label,
    .signature {
      font-family: Georgia, "Times New Roman", serif;
    }

    h1 {
      max-width: 12ch;
      margin: 0 auto;
      color: var(--wine-dark);
      font-size: clamp(3rem, 14vw, 7rem);
      font-weight: 400;
      letter-spacing: -.07em;
      line-height: .88;
    }

    .intro-copy {
      max-width: 32rem;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(.98rem, 2.6vw, 1.12rem);
      line-height: 1.6;
    }

    .envelope-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      width: min(100%, 960px);
      margin: 0 auto;
    }

    .envelope-card {
      position: relative;
      min-height: 184px;
      padding: 18px 18px 17px;
      overflow: hidden;
      border: 1px solid rgba(122, 61, 79, .15);
      border-radius: 24px;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      background: transparent;
      box-shadow: 0 17px 35px rgba(93, 49, 47, .08);
      transition: transform 280ms var(--ease), box-shadow 280ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope-card:hover {
      transform: translateY(-7px) rotate(-.6deg);
      box-shadow: 0 25px 42px rgba(93, 49, 47, .17);
    }

    .envelope-card:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
    }

    .envelope-card.is-opening {
      transform: translateY(-10px) scale(1.08) rotate(-1deg);
      box-shadow: 0 34px 56px rgba(93, 49, 47, .24);
    }

    .envelope-card:nth-child(2).is-opening {
      transform: translateY(-10px) scale(1.08) rotate(1deg);
    }

    .envelope-card:nth-child(3).is-opening {
      transform: translateY(-10px) scale(1.08) rotate(-.7deg);
    }

    .envelope-card:nth-child(2):hover {
      transform: translateY(-7px) rotate(.6deg);
    }

    .envelope-card:nth-child(3):hover {
      transform: translateY(-7px) rotate(-.35deg);
    }

    .envelope-card[data-letter="0"] {
      background: linear-gradient(145deg, #f7c9bf, #e49aa0);
    }

    .envelope-card[data-letter="1"] {
      background: linear-gradient(145deg, #e8cfd0, #c99bb0);
    }

    .envelope-card[data-letter="2"] {
      background: linear-gradient(145deg, #f4d8a5, #dda86f);
    }

    .envelope-art {
      position: absolute;
      inset: 0;
      z-index: 0;
      perspective: 900px;
    }

    .envelope-back {
      position: absolute;
      inset: 24% 12% 9%;
      border-radius: 5px 5px 18px 18px;
      background: rgba(255, 250, 242, .38);
      box-shadow: 0 13px 20px rgba(91, 49, 45, .12);
    }

    .envelope-back::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(255, 255, 255, .28), transparent 60%);
      clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
    }

    .envelope-flap {
      position: absolute;
      top: 24%;
      left: 12%;
      right: 12%;
      height: 48%;
      z-index: 2;
      transform-origin: top;
      border-radius: 5px 5px 0 0;
      background: rgba(255, 241, 230, .48);
      clip-path: polygon(0 0, 50% 70%, 100% 0);
      transition: transform 620ms var(--ease), opacity 300ms ease;
    }

    .envelope-front {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 9%;
      z-index: 3;
      height: 56%;
      border-radius: 0 0 18px 18px;
      background: rgba(255, 250, 242, .24);
      clip-path: polygon(0 20%, 50% 58%, 100% 20%, 100% 100%, 0 100%);
    }

    .envelope-seal {
      position: absolute;
      top: 55%;
      left: 50%;
      z-index: 5;
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 3px solid rgba(255, 249, 235, .65);
      border-radius: 50%;
      color: var(--wine-dark);
      background: var(--yellow);
      box-shadow: 0 7px 15px rgba(99, 56, 24, .2);
      transform: translate(-50%, -50%);
      transition: transform 400ms ease, opacity 300ms ease;
    }

    .envelope-content {
      position: relative;
      z-index: 6;
      display: flex;
      height: 100%;
      flex-direction: column;
      justify-content: flex-end;
    }

    .envelope-number {
      color: rgba(78, 37, 53, .65);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .envelope-label {
      max-width: 14ch;
      margin: 10px 0 0;
      color: var(--wine-dark);
      font-size: clamp(1.25rem, 5.5vw, 1.7rem);
      font-weight: 400;
      line-height: 1.04;
    }

    .envelope-cta {
      margin-top: 15px;
      color: rgba(78, 37, 53, .72);
      font-size: .82rem;
      font-weight: 700;
    }

    .envelope-card.is-opening .envelope-flap {
      transform: rotateX(188deg) translateY(-7px);
      opacity: .7;
    }

    .envelope-card.is-opening .envelope-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.5);
    }

    .opening-note {
      margin: 26px 0 0;
      color: rgba(63, 48, 52, .66);
      font-size: .78rem;
      text-align: center;
    }

    .letter-view {
      display: grid;
      align-content: center;
      min-height: calc(100vh - 78px);
      padding: 22px 0;
      opacity: 0;
      transform: translateY(20px) scale(.98);
      visibility: hidden;
      transition: opacity 480ms ease, transform 600ms var(--ease), visibility 0s linear 480ms;
    }

    .letter-view.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      visibility: visible;
      transition-delay: 240ms, 240ms, 0s;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      min-height: 44px;
      margin-bottom: 18px;
      padding: 8px 14px 8px 7px;
      border: 1px solid rgba(122, 61, 79, .14);
      border-radius: 999px;
      color: var(--wine);
      background: rgba(255, 250, 242, .48);
      cursor: pointer;
      font-size: .84rem;
      font-weight: 800;
    }

    .back-button:hover {
      background: var(--paper);
    }

    .back-button:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    .back-arrow {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow-light);
      font-size: 1rem;
    }

    .letter-card {
      position: relative;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 12px;
      border: 1px solid rgba(122, 61, 79, .11);
      border-radius: 30px;
      background: rgba(255, 250, 242, .55);
      box-shadow: 0 24px 70px rgba(93, 49, 47, .11);
    }

    .letter-inner {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 7vw, 54px) clamp(20px, 8vw, 70px) clamp(30px, 7vw, 56px);
      border-radius: 21px;
      background: var(--paper);
    }

    .letter-inner::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .52;
      background: repeating-linear-gradient(0deg, transparent 0 31px, rgba(220, 181, 135, .12) 32px);
    }

    .letter-flower {
      top: -8px;
      right: -3px;
      z-index: 1;
      transform: scale(.7) rotate(16deg);
    }

    .letter-photo {
      position: relative;
      z-index: 2;
      width: 100%;
      height: clamp(132px, 36vw, 220px);
      margin: 0 0 30px;
      padding: 0;
      overflow: hidden;
      border-radius: 15px;
      background: linear-gradient(135deg, #f9dd91, #e9a17c 62%, #ba6f74);
    }

    .letter-photo-grid {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .letter-photo img {
      width: 100%;
      height: 100%;
      min-width: 0;
      object-fit: cover;
      background: linear-gradient(135deg, #f9dd91, #e9a17c 62%, #ba6f74);
    }

    .photo-fallback {
      display: grid;
      position: absolute;
      inset: 0;
      place-items: center;
      color: rgba(78, 37, 53, .74);
      text-align: center;
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, .45) 0 10%, transparent 11%), linear-gradient(135deg, #f9dd91, #e9a17c 62%, #ba6f74);
    }

    .photo-fallback span {
      max-width: 14ch;
      font-family: Georgia, serif;
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      line-height: 1;
    }

    .letter-kicker {
      position: relative;
      z-index: 2;
      margin: 0 0 13px;
      color: var(--wine);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .letter-title {
      position: relative;
      z-index: 2;
      max-width: 10ch;
      margin: 0 0 25px;
      color: var(--wine-dark);
      font-size: clamp(2.6rem, 11vw, 5.3rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: .9;
    }

    .letter-copy {
      position: relative;
      z-index: 2;
      max-width: 54ch;
      color: #55464a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.04rem, 2.8vw, 1.2rem);
      line-height: 1.75;
    }

    .letter-copy p {
      margin: 0 0 18px;
    }

    .signature {
      position: relative;
      z-index: 2;
      margin: 30px 0 0;
      color: var(--wine);
      font-size: 1.35rem;
      font-style: italic;
      line-height: 1.35;
    }

    @media (max-width: 379px) {
      .letter-card {
        padding: 8px;
      }

      .letter-inner {
        padding-right: 16px;
        padding-left: 16px;
      }

      .letter-title {
        font-size: clamp(2.35rem, 13vw, 3.5rem);
      }
    }

    @media (min-width: 580px) {
      .site-shell {
        padding: 42px 30px 60px;
      }

      .envelope-card {
        min-height: 270px;
        padding: 25px 24px 24px;
      }

      .envelope-back {
        inset: 25% 10% 8%;
      }

      .envelope-flap {
        top: 25%;
        left: 10%;
        right: 10%;
      }

      .envelope-front {
        left: 10%;
        right: 10%;
        bottom: 8%;
      }
    }

    @media (min-width: 760px) {
      .site-shell {
        padding-top: 56px;
      }

      .photo-collage {
        height: 260px;
        margin-bottom: 32px;
      }

      .collage-photo--featured {
        width: 34%;
      }

      .intro {
        margin-bottom: 46px;
      }

      .envelope-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .envelope-card {
        min-height: 330px;
      }

      .letter-view {
        padding-top: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  </main>
  <script>
    const letters = [
      { theme: "Una verdad sencilla", title: "Lo que amo de vos", images: ["images/Fotos Nosotros Juntos/WhatsApp Image 2026-09-22 at 10.02.16 PM.jpeg", "images/Fotos Nosotros Juntos/WhatsApp Image 2026-09-22 at 10.02.28 PM.jpeg"], fallback: "Todo lo lindo de vos", paragraphs: ["Amo la forma en que hacés que los días comunes se sientan especiales. Amo tu risa, tu manera de mirar el mundo y esa ternura que aparece incluso cuando no te das cuenta.", "En tu cumpleaños quiero recordarte que sos una persona inmensa, de esas que dejan luz donde pasan. Gracias por existir y por dejarme acompañarte en este camino."], signature: "Con todo mi amor,\nTu pollito" },
      { theme: "Nuestros pequeños tesoros", title: "Nuestros recuerdos", images: ["images/Fotos Nosotros Juntos/WhatsApp Image 2026-09-22 at 10.04.39 PM.jpeg", "images/Fotos Nosotros Juntos/WhatsApp Image 2026-09-22 at 10.08.51 PM.jpeg"], fallback: "Nuestra historia", paragraphs: ["Guardo nuestros recuerdos como pequeñas postales: cada conversación, cada abrazo, cada risa que nos encontró sin avisar. Con vos, hasta lo más simple se vuelve algo que quiero conservar.", "Ojalá sigamos llenando la vida de momentos nuestros, de planes improvisados y de historias que un día vamos a contar sonriendo. Mi lugar favorito siempre va a ser cerquita tuyo."], signature: "Siempre juntos,\nTu pollito" },
      { theme: "Un nuevo año para brillar", title: "Deseos para tu cumpleaños", images: ["images/Fotos Nosotros Juntos/WhatsApp Image 2026-09-22 at 10.09.07 PM.jpeg", "images/Fotos Nosotros Juntos/WhatsApp Image 2026-09-22 at 10.02.28 PM.jpeg"], fallback: "Que se cumpla todo", paragraphs: ["Deseo que este nuevo año te encuentre rodeada de amor, proyectos bonitos y motivos para sonreír. Que nunca te falte la confianza para perseguir eso que te hace feliz.", "Y deseo poder estar ahí para celebrarte, cuidarte y recordarte cada vez que haga falta lo especial que sos. Feliz cumpleaños, mi amor. Te merecés todo lo hermoso."], signature: "Feliz cumpleaños,\nTu pollito" }
    ];
    const landingView = document.getElementById("landingView");
    const letterView = document.getElementById("letterView");
    const backButton = document.getElementById("backButton");
    const letterImageOne = document.getElementById("letterImageOne");
    const letterImageTwo = document.getElementById("letterImageTwo");
    const photoFallback = document.getElementById("photoFallback");
    const fallbackText = document.getElementById("fallbackText");
    const letterKicker = document.getElementById("letterKicker");
    const letterTitle = document.getElementById("letterTitle");
    const letterCopy = document.getElementById("letterCopy");
    const letterSignature = document.getElementById("letterSignature");
    const envelopeCards = [...document.querySelectorAll(".envelope-card")];
    let activeEnvelope = null;
    let isTransitioning = false;
    let failedLetterImages = 0;
    letterView.inert = true;
    function renderLetter(index) {
      const letter = letters[index];
      letterKicker.textContent = letter.theme;
      letterTitle.textContent = letter.title;
      fallbackText.textContent = letter.fallback;
      letterCopy.innerHTML = letter.paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("");
      letterSignature.innerHTML = letter.signature.replace("\n", "<br>");
      failedLetterImages = 0;
      [letterImageOne, letterImageTwo].forEach((image, imageIndex) => {
        image.alt = `Foto ${imageIndex + 1} de ${letter.title.toLowerCase()}`;
        image.hidden = false;
        image.src = letter.images[imageIndex];
      });
      photoFallback.hidden = true;
    }
    [letterImageOne, letterImageTwo].forEach((image) => image.addEventListener("error", () => {
      image.hidden = true;
      failedLetterImages += 1;
      if (failedLetterImages === 2) photoFallback.hidden = false;
    }));
    function openLetter(index) {
      if (isTransitioning) return;
      isTransitioning = true;
      activeEnvelope = envelopeCards[index];
      renderLetter(index);
      activeEnvelope.classList.add("is-opening");
      landingView.classList.add("is-leaving");
      window.setTimeout(() => { letterView.classList.add("is-visible"); letterView.setAttribute("aria-hidden", "false"); letterView.inert = false; backButton.focus(); isTransitioning = false; }, 440);
    }
    function closeLetter() {
      if (isTransitioning || !activeEnvelope) return;
      isTransitioning = true;
      letterView.classList.remove("is-visible");
      letterView.setAttribute("aria-hidden", "true");
      letterView.inert = true;
      landingView.classList.remove("is-leaving");
      window.setTimeout(() => { activeEnvelope.classList.remove("is-opening"); activeEnvelope.focus(); isTransitioning = false; }, 480);
    }
    envelopeCards.forEach((envelope) => envelope.addEventListener("click", () => openLetter(Number(envelope.dataset.letter))));
    backButton.addEventListener("click", closeLetter);
    document.addEventListener("keydown", (event) => { if (event.key === "Escape" && letterView.classList.contains("is-visible")) closeLetter(); });
  </script>
